<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="270" viewBox="0 0 1100 270"><rect width="1100" height="270" fill="white"/><text x="550" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">iPhoneでの検査フロー</text><g font-family="sans-serif" font-size="18" text-anchor="middle"><g fill="#eff6ff" stroke="#3b82f6" stroke-width="3"><rect x="20" y="90" width="150" height="95" rx="12"/><rect x="200" y="90" width="150" height="95" rx="12"/><rect x="380" y="90" width="150" height="95" rx="12"/><rect x="560" y="90" width="150" height="95" rx="12"/><rect x="740" y="90" width="150" height="95" rx="12"/><rect x="920" y="90" width="150" height="95" rx="12"/></g><text x="95" y="125" font-weight="700">1. カメラ開始</text><text x="95" y="155">端子台を映す</text><text x="275" y="125" font-weight="700">2. 向き確認</text><text x="275" y="155">L / Label設定</text><text x="455" y="125" font-weight="700">3. 検査開始</text><text x="455" y="155">OCR・照合</text><text x="635" y="125" font-weight="700">4. 消込確認</text><text x="635" y="155">L / Label / R</text><text x="815" y="125" font-weight="700">5. 最終確認</text><text x="815" y="155">NG・未完了確認</text><text x="995" y="125" font-weight="700">6. 完了</text><text x="995" y="155">結果を保存</text></g><g stroke="#64748b" stroke-width="4" fill="#64748b"><path d="M170 137H195"/><path d="M190 130L200 137L190 144"/><path d="M350 137H375"/><path d="M370 130L380 137L370 144"/><path d="M530 137H555"/><path d="M550 130L560 137L550 144"/><path d="M710 137H735"/><path d="M730 130L740 137L730 144"/><path d="M890 137H915"/><path d="M910 130L920 137L910 144"/></g><text x="550" y="235" text-anchor="middle" font-family="sans-serif" font-size="18">未完了やNGがある場合は完了せず、対象行を再確認します</text></svg>