name: Rebuild guide image

on:
  push:
    branches:
      - docs/fix-guide-image-binary
    paths:
      - '.tmp/guide-image-v2/**'
      - '.github/workflows/rebuild-guide-image.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-guide-image-binary
      - name: Rebuild JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/guide-image-v2/chunk*.txt | base64 --decode > docs/images/visionlink-l-label-active.jpg
          test "$(wc -c < docs/images/visionlink-l-label-active.jpg)" -eq 47636
          file docs/images/visionlink-l-label-active.jpg | grep -q 'JPEG image data'
      - name: Commit rebuilt image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/visionlink-l-label-active.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Docs: rebuild L Label guide image binary'
          git push origin HEAD:docs/fix-guide-image-binary
