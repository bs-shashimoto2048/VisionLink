name: Rebuild guide image

on:
  push:
    branches:
      - docs/fix-guide-image-binary
    paths:
      - '.tmp/guide-image-v2/**'
      - '.tmp/guide-image-v3/**'
      - '.github/workflows/rebuild-guide-image.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/fix-guide-image-binary
      - name: Rebuild JPEG
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .tmp/guide-image-v2/chunk00.txt \
            .tmp/guide-image-v2/chunk01.txt \
            .tmp/guide-image-v2/chunk02.txt \
            .tmp/guide-image-v2/chunk03.txt \
            .tmp/guide-image-v2/chunk04.txt \
            .tmp/guide-image-v2/chunk05.txt \
            .tmp/guide-image-v2/chunk06.txt \
            .tmp/guide-image-v3/c070.txt \
            .tmp/guide-image-v3/c071.txt \
            .tmp/guide-image-v3/c080.txt \
            .tmp/guide-image-v3/c081.txt \
            .tmp/guide-image-v2/chunk09.txt \
            .tmp/guide-image-v2/chunk10.txt \
            | base64 --decode > docs/images/visionlink-l-label-active.jpg
          test "$(wc -c < docs/images/visionlink-l-label-active.jpg)" -eq 47636
          test "$(sha256sum docs/images/visionlink-l-label-active.jpg | cut -d' ' -f1)" = 'd089297055bf7c367adf2816bb37711cc1e681ce6e024c13f5621c0d1d9e15fc'
          file docs/images/visionlink-l-label-active.jpg | grep -q 'JPEG image data'
      - name: Commit rebuilt image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/visionlink-l-label-active.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Docs: rebuild verified L Label guide image binary'
          git push origin HEAD:docs/fix-guide-image-binary
